<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off Meta Gaming</title>
<meta name="description" content="Off Meta Gaming — trading card shop in Cape Girardeau, MO. Something new is brewing.">
<meta name="theme-color" content="#2F6B4E">
<meta property="og:title" content="Off Meta Gaming">
<meta property="og:description" content="Trading card shop in Cape Girardeau, MO. Something new is brewing.">
<meta property="og:image" content="https://offmetagaming.net/assets/og-beach.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..900&family=Nunito+Sans:wght@400;700;800;900&display=swap">
<style>
:root{--ground:#FAF6ED;--card:#FFFDF7;--ink:#28211A;--ink-2:#5A4F41;--acc:#2F6B4E;--acc-deep:#24553D;--pop:#C98F2D;--pink:#D8447C;--line:#C9BCA4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ground);color:var(--ink);font-family:"Nunito Sans",-apple-system,sans-serif;text-align:center;padding:24px}
.card{max-width:440px}
.sticker{width:150px;height:150px;border-radius:50%;background:var(--card);border:3px solid var(--ink);box-shadow:5px 6px 0 rgba(60,45,20,.22);transform:rotate(-6deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;margin:0 auto 28px}
.sticker .omg{font-weight:900;font-size:52px;letter-spacing:-.03em;line-height:1;color:var(--pink);text-shadow:3px 3px 0 var(--acc)}
.sticker .sub{font-weight:900;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2)}
h1{font-family:"Fraunces",serif;font-size:clamp(28px,6vw,38px);margin:0 0 10px;letter-spacing:-.01em}
p{color:var(--ink-2);font-size:17px;line-height:1.6;margin:0 0 24px}
.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-block;font-weight:800;text-decoration:none;padding:12px 22px;border-radius:10px;background:var(--acc);color:#FDFBF5}
a.btn:hover{background:var(--acc-deep)}
a.btn.ghost{background:none;border:2px solid var(--line);color:var(--ink)}
.foot{margin-top:34px;font-size:13.5px;color:var(--ink-2)}
</style>
</head>
<body>
<main class="card">
  <img src="/assets/omg-black.png" alt="Off Meta Gaming" style="width:min(300px,70vw);height:auto;margin:0 auto 30px;display:block">
  <h1>Something's brewing… 🎴</h1>
  <p>The new Off Meta Gaming site is getting its final shuffle. Meanwhile, the shop's open and the games are firing — come say hi.</p>
  <div class="links">
    <a class="btn" href="https://discord.gg/c3nWQ8a9ea">Join the Discord</a>
    <a class="btn ghost" href="tel:+15738030635">Call the shop</a>
  </div>
  <p class="foot">2104 William St, Cape Girardeau, MO · <a href="https://www.facebook.com/p/Off-Meta-Gaming-61579627653873/" style="color:var(--acc-deep)">Facebook</a></p>
</main>
</body>
</html>
